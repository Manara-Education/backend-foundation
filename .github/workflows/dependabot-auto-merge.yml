# Safe auto-merge for Dependabot pull requests — backend-foundation.
#
# Policy (see the PR description for the full rationale):
#   auto-merge      : semver-patch application dependencies
#                     semver-patch and semver-minor GitHub Actions bumps
#   human review    : semver-minor application dependencies
#                     semver-major anything (a Spring Boot major is a migration)
#                     every security update
#
# The eligibility rules in "Decide whether this update may auto-merge" are not
# changed by the merge binding this file now carries, and nothing here decides
# them. They do not currently match the "every security update" line above: a
# Dependabot security patch reports `version-update:semver-patch` and is
# therefore eligible today. Reconciling the two is an open policy decision,
# recorded here rather than guessed at, because guessing either way silently
# changes what ships.
#
# Why this workflow verifies CI itself instead of just calling `gh pr merge --auto`:
#   GitHub's auto-merge merges a pull request as soon as nothing *required* is
#   blocking it. Whether anything is required is a repository setting that can
#   be changed, or disabled, without touching this file — so a pipeline that
#   relies on that setting alone is only as strong as something it cannot see.
#   This workflow therefore proves the property itself on every run: the named
#   CI checks for this repository must exist on the pull request's current head,
#   must have been produced by GitHub Actions rather than by any app that
#   happens to hold checks:write, and must have concluded `success` — not
#   skipped, not neutral, not merely present. Auto-merge is still what performs
#   the merge, so every protection that IS configured — required reviews,
#   required status checks, linear history, merge queues — continues to apply
#   and is never bypassed.
#
#   The merge is then bound to the commit that was verified.
#   `--match-head-commit` carries that SHA to GitHub, which refuses the request
#   if the head has moved, so a commit pushed after verification cannot merge on
#   the strength of an earlier commit's green ticks.
#
#   The check names below are a contract with ci.yml and security.yml. Renaming
#   one of those jobs means renaming it here in the same pull request, or every
#   dependency update will be held until someone notices — which is the intended
#   failure direction.
#
#   `Security Gate` is in that list for a reason worth spelling out. A
#   dependency bump is the single most likely pull request to introduce a known
#   vulnerability, and it is also the one nobody reads: it merges itself. CI
#   proves the new version still compiles and passes the tests, which says
#   nothing at all about whether an advisory was published against it. Without
#   the gate in this list, `./mvnw verify` going green would be the entire
#   safety argument for shipping a dependency change unread.
#
#   The verifier refuses on absent, skipped, neutral and every non-success
#   conclusion alike, so a Security Gate that never ran holds the pull request
#   instead of waving it through — which was the specific hole here before the
#   named-check verifier replaced the "nothing is pending, therefore green"
#   sweep.
#
# This workflow never runs code from the pull request, and that claim needs
# stating carefully, because the trigger is `pull_request_target`.
#
#   `pull_request_target` is used deliberately and is the reason this can merge
#   at all: a `pull_request` run on a Dependabot pull request receives a
#   read-only token, so the gate could verify but never act. The trade is that
#   the job now runs in the context of the base repository, holding a write
#   token — which makes what it checks out the whole of the question.
#
#   It checks out `github.event.pull_request.base.sha`. Not the pull request's
#   head, not the merge ref, not a branch name that could resolve to either. So
#   the gate always executes the reviewed version of itself rather than a
#   version the pull request could have edited, and the dependency changes
#   under review are never fetched, built, installed, or executed here. Nothing
#   in this job runs a package manager, a build, or a test.
#
#   If a step is ever added that needs the pull request's own contents, it does
#   not belong in this file. Put it in a `pull_request`-triggered workflow with
#   no write scopes, and let this one read its conclusion like any other check.
#
# This workflow never triggers a deployment. Deployment remains the frozen,
# manual-only workflow in deploy.yml, which has no push trigger.
#
# This workflow never approves a PR. "Allow GitHub Actions to create and approve
# pull requests" is disabled on this repository and does not need to be enabled:
# approval is a human act, and self-approval would defeat the review requirement.

name: Dependabot auto-merge

on:
  pull_request_target:

# Nothing by default. Each job asks for exactly what it uses, so a job added to
# this workflow later starts with no token scopes rather than inheriting these.
permissions: {}

# One decision per pull request at a time. Dependabot rebases by force-pushing,
# so without this the run that verified the old head would still be polling
# while the run for the new head is deciding.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    name: Dependabot auto-merge
    runs-on: ubuntu-latest
    # Raised from 45 with the Security Gate. The gate runs CodeQL and builds the
    # container image, so it reports materially later than CI does, and a job
    # timeout shorter than the thing it is waiting for turns "the gate is still
    # running" into "refused" on every single dependency update.
    timeout-minutes: 60

    # Least privilege, and every scope is used:
    #   contents: write       -> completing the merge, reading the base commit
    #   pull-requests: write  -> enabling and revoking auto-merge, requesting a
    #                            reviewer, commenting
    #   checks: read          -> reading the CI check runs this job verifies
    permissions:
      contents: write
      pull-requests: write
      checks: read

    # Ignore human PRs and any other bot. Both the triggering actor and the PR
    # author must be Dependabot, so a re-run by a human on a Dependabot PR, or a
    # PR merely *named* like a Dependabot PR, does not reach the merge step.
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      # Official metadata source. The update type is read from Dependabot's own
      # metadata rather than parsed out of the PR title, which is unreliable and
      # spoofable. For a grouped PR this reports the highest semver bump in the
      # group, so a group containing any major is correctly treated as major.
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this update may auto-merge
        id: policy
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          eligible=false

          case "$UPDATE_TYPE" in
            version-update:semver-patch)
              eligible=true
              ;;
            version-update:semver-minor)
              # Minor bumps of the CI toolchain are low risk and fully exercised
              # by the very run that validates them. Minor bumps of application
              # dependencies are not, and stay with a human.
              if [ "$ECOSYSTEM" = "github_actions" ]; then
                eligible=true
              fi
              ;;
          esac

          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "Ecosystem=$ECOSYSTEM UpdateType=$UPDATE_TYPE Eligible=$eligible"

      # ---------------------------------------------------------------------
      # Eligible updates: verify CI on this exact commit, then merge it.
      # ---------------------------------------------------------------------

      # `ref` is the BASE commit, deliberately, and never the pull request head.
      # This job holds a write token; checking out the head would put code the
      # pull request controls — including a rewritten copy of the gate below —
      # on disk inside a privileged context. The base commit is code that has
      # already been reviewed and merged. `persist-credentials: false` keeps the
      # token out of the working copy's git config as well.
      - name: Check out the merge gate from the base branch
        if: steps.policy.outputs.eligible == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Verify CI on this commit and merge that same commit
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # The check names are passed one --check at a time rather than as one
        # delimited list. A check-run name is free text: the sibling frontend
        # repository's CI job is called "Install, type-check and build", and a
        # comma-separated list would split that name in half and then refuse
        # every update for want of a check called "Install".
        #
        # --timeout-seconds is raised from the script's 1800s default because
        # `Security Gate` fans out over seven scanners, one of which runs CodeQL
        # and another of which builds the container image. 45 minutes sits
        # inside this job's 60-minute limit, so the script refuses on its own
        # terms — with a message naming the check it was still waiting on —
        # rather than being killed mid-poll with no explanation.
        run: |
          .github/scripts/verify-dependabot-merge.sh \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --expected-head "$HEAD_SHA" \
            --producer github-actions \
            --timeout-seconds 2700 \
            --check "Build and test" \
            --check "Build the container image" \
            --check "Security Gate"

      # ---------------------------------------------------------------------
      # Everything else: route to a human. Never merged by this workflow.
      # ---------------------------------------------------------------------
      # `reviewers` is no longer supported in dependabot.yml, so the repository's
      # standing reviewer is requested here, and only on the PRs that need one.
      - name: Request human review
        if: steps.policy.outputs.eligible != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-reviewer Mohamed-Hamza

      - name: Explain why the PR is held for review
        if: steps.policy.outputs.eligible != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Built as an environment value rather than interpolated into the shell,
          # so metadata can never be executed as part of the command.
          BODY: |
            🤖 **Held for human review** — this update is outside the auto-merge policy.

            | | |
            |---|---|
            | Ecosystem | `${{ steps.meta.outputs.package-ecosystem }}` |
            | Update type | `${{ steps.meta.outputs.update-type }}` |

            Auto-merge covers patch-level application dependencies and patch/minor
            GitHub Actions bumps only. Please review the changelog, confirm CI is
            green, and merge manually.

            `@dependabot rebase`, `@dependabot recreate` and `@dependabot merge`
            all work as normal on this PR.
        run: gh pr comment "$PR_URL" --body "$BODY"
