# Deploys a published backend release to the production server.
#
# The pipeline this is the last stage of:
#
#     push tag vX.Y.Z
#       -> Release        creates the GitHub Release (validates semver, main-only)
#       -> Publish image  builds and pushes the image to GHCR
#       -> THIS WORKFLOW  pulls that image on the server and restarts the backend
#
# Nothing is built here and nothing is built on the server. The artifact that
# reaches production is byte-for-byte the one Publish image pushed, which is the
# one built from the released commit that CI had already proven.

name: Deploy to production

# Chained to "Publish image" finishing, NOT to `release: published`, and NOT to
# the Release workflow.
#
# Two separate traps are being avoided here, and both fail silently:
#
#   1. `on: release: published` NEVER FIRES for a release created with
#      GITHUB_TOKEN — GitHub's recursion guard. release.yml creates the release
#      exactly that way. This is not theoretical: v1.0.0 shipped a release with
#      no image because publish.yml was originally written that way.
#
#   2. Chaining to "Publish image" — the obvious choice, since the image existing
#      is the precondition for deploying — LOSES THE VERSION. A workflow_run-
#      triggered run's own `head_branch` is the DEFAULT BRANCH, not the tag that
#      started the chain. Publish can still see the tag because it reads the
#      *Release* run's head_branch; a third workflow chained behind Publish reads
#      Publish's own, which is `develop`. Observed exactly that on frontend
#      v1.0.1:
#
#          RAW_TAG: develop
#          ##[error]Resolved 'develop', which is not a vMAJOR.MINOR.PATCH tag.
#
#      So this chains to "Release", whose head_branch IS the tag, and waits for
#      the image to appear rather than assuming it already has. The wait is the
#      step below, and it is a guard worth having regardless.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  # Redeploy an existing release: a deployment that failed on a transient error,
  # or a rollback to a known-good tag. Re-running the same tag is safe — it pulls
  # the same immutable image and restarts the same service.
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to deploy, e.g. v1.4.0"
        required: true

permissions:
  contents: read
  checks: read
  actions: read
  # Reading the image manifest from GHCR to prove the tag exists before the
  # server is touched at all.
  packages: read

# One deployment at a time. cancel-in-progress is deliberately false: cancelling
# a run mid-way could leave .env rewritten with the service half-restarted.
concurrency:
  group: deploy-production-backend
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # 0. Nothing ships that was not assessed
  # ===========================================================================
  # Before this job existed, deployment depended on nothing security-related at
  # all. `Release` validated the tag, `Publish image` built the image, and this
  # workflow pushed it to production — three steps, none of which ever asked
  # whether the code was known to be vulnerable. A CVE published against a
  # dependency after the last CI run would have shipped without anything
  # noticing.
  #
  # This job closes that. It requires a `Security Gate` check run, concluded
  # `success`, ON THE EXACT COMMIT THE RELEASE TAG POINTS AT — not on develop,
  # not on the tip of main, not on "a recent commit". A tag is a movable label;
  # the commit is what is being shipped.
  #
  # It holds no environment, so no deployment secret is in scope here. What it
  # can do is read check runs and start a workflow run; what it cannot do is
  # reach production.
  security-gate:
    name: Verify the Security Gate for this release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read   # resolve the tag to a commit, read policy.yml
      checks: read     # read the Security Gate check run on that commit
      actions: write   # re-assess the release if the existing pass is stale

    # The same guard the deploy job carries. workflow_run fires on completion
    # whatever the outcome, so a FAILED release must not reach even this job.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      tag: ${{ steps.commit.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
      block-severities: ${{ steps.policy.outputs.block_severities }}

    steps:
      # Resolved here as well as in the deploy job, from the same source and with
      # the same validation, because this job must not be able to verify one
      # version while the deploy job ships another.
      - name: Resolve the release tag to the exact commit
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RAW_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Resolved '$RAW_TAG', which is not a vMAJOR.MINOR.PATCH release tag."
            exit 1
          fi
          # The commits endpoint dereferences a tag — annotated or lightweight —
          # to the commit it ultimately points at, which is the thing the
          # Security Gate reported on.
          SHA="$(gh api "repos/${REPO}/commits/${RAW_TAG}" --jq '.sha')"
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::Could not resolve $RAW_TAG to a commit."; exit 1; }
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "$RAW_TAG -> $SHA"

      # The released commit, so the policy that is applied is the policy that
      # shipped with the release rather than whatever develop says today.
      - name: Check out the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false

      - name: Read the thresholds out of the security policy
        id: policy
        run: |
          set -euo pipefail
          if ! python3 -c 'import yaml' 2>/dev/null; then
            python3 -m pip install --disable-pip-version-check --quiet 'PyYAML==6.0.3' \
              || python3 -m pip install --disable-pip-version-check --quiet \
                   --break-system-packages 'PyYAML==6.0.3'
          fi
          # Both values come from .github/security/policy.yml so that the
          # deployment gate and the merge gate cannot disagree about what
          # "fresh" or "blocking" means. Hardcoding either here would let them
          # drift apart silently, and the drift would only ever be discovered
          # by shipping something.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          policy = yaml.safe_load(open(".github/security/policy.yml")) or {}
          max_age = (policy.get("intelligence") or {}).get("max_age_hours", 24)
          threshold = (policy.get("blocking") or {}).get("block_at_or_above", "HIGH")
          scale = ["INFO", "LOW", "MEDIUM", "HIGH", "CRITICAL"]
          at_or_above = scale[scale.index(threshold.upper()):]
          print(f"max_age_hours={float(max_age):g}")
          print("block_severities=" + ",".join(at_or_above))
          PY
          cat "$GITHUB_OUTPUT"

      # Poll, do not sample.
      #
      # `Release` and `security.yml`'s push trigger on main are independent
      # chains started by the same tag push. When this job begins, the Security
      # Gate run for the released commit is very often still going. Reading the
      # check runs once and calling `in_progress` a failure would refuse every
      # release; calling it a pass would defeat the entire gate. So this waits.
      #
      #   success                     -> proceed
      #   failure/cancelled/timed_out -> refuse immediately; the answer is in,
      #                                  and waiting out the clock only delays it
      #   still running               -> keep waiting until the deadline
      #   ABSENT                      -> keep waiting, then refuse. "No Security
      #                                  Gate ever ran on this commit" is the
      #                                  precise failure this job exists to
      #                                  prevent and is never a pass.
      #
      # `app.slug == "github-actions"` is checked as well as the name: a check
      # run's name is free text that any GitHub App holding checks:write can
      # produce, so the name alone does not establish who said it.
      - name: Require a successful Security Gate on the released commit
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
          TAG: ${{ steps.commit.outputs.tag }}
          GATE: Security Gate
        run: |
          set -euo pipefail

          read_gate() {
            gh api --paginate "repos/${REPO}/commits/${SHA}/check-runs?per_page=100" \
              --jq '.check_runs[]' 2>/dev/null | jq -s -c \
              --arg n "$GATE" \
              '[.[] | select(.name == $n and .app.slug == "github-actions")]
               | sort_by(.id) | last // empty'
          }

          deadline=$(( SECONDS + 1200 ))
          while :; do
            entry="$(read_gate)"

            if [ -n "$entry" ]; then
              status="$(printf '%s' "$entry" | jq -r '.status')"
              conclusion="$(printf '%s' "$entry" | jq -r '.conclusion // "none"')"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::'$GATE' concluded '$conclusion' on $SHA (tag $TAG)."
                  echo "::error::$TAG is NOT deployable. Fix the finding, cut a new release, and deploy that."
                  echo "::error::The run: $(printf '%s' "$entry" | jq -r '.html_url')"
                  exit 1
                fi
                completed_at="$(printf '%s' "$entry" | jq -r '.completed_at // ""')"
                echo "completed_at=$completed_at" >> "$GITHUB_OUTPUT"
                echo "url=$(printf '%s' "$entry" | jq -r '.html_url')" >> "$GITHUB_OUTPUT"
                echo "'$GATE' succeeded on $SHA at $completed_at."
                exit 0
              fi
              echo "'$GATE' on $SHA is $status; waiting."
            else
              echo "no '$GATE' check run on $SHA yet; waiting."
            fi

            if (( SECONDS >= deadline )); then
              if [ -z "$entry" ]; then
                echo "::error::No '$GATE' check run exists on $SHA (tag $TAG) after 20 minutes."
                echo "::error::This commit was never security-assessed, so it is not deployable."
                echo "::error::Run the Security workflow against $TAG and redeploy once it passes."
              else
                echo "::error::'$GATE' on $SHA did not finish within 20 minutes; refusing to deploy."
              fi
              exit 1
            fi
            sleep 20
          done

      # A pass is not a pass forever.
      #
      # A tag can be redeployed weeks after it was cut — a rollback, or a retry
      # of a deployment that failed on something transient. Its Security Gate
      # would still say `success`, and would still be describing a world in
      # which the advisories published since do not exist. GitHub has no notion
      # of a check expiring, so the age is checked here, against the same
      # freshness window policy.yml gives the merge gate.
      #
      # A stale pass is not accepted and is not overridden either: the release is
      # re-assessed, by dispatching the Security workflow against the tag, and
      # the FRESH result is what decides. If the re-assessment cannot be started
      # or does not finish in time, this fails. Falling back to the stale pass
      # would make the whole check decorative.
      - name: Re-assess the release if the pass is older than the freshness window
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
          TAG: ${{ steps.commit.outputs.tag }}
          COMPLETED_AT: ${{ steps.gate.outputs.completed_at }}
          MAX_AGE_HOURS: ${{ steps.policy.outputs.max_age_hours }}
          GATE: Security Gate
        run: |
          set -euo pipefail

          age_h="$(python3 -c "
          import datetime as dt, os, sys
          raw = os.environ['COMPLETED_AT']
          if not raw:
              print('999999'); sys.exit(0)
          done = dt.datetime.fromisoformat(raw.replace('Z', '+00:00'))
          print(f\"{(dt.datetime.now(dt.timezone.utc) - done).total_seconds() / 3600:.2f}\")
          ")"

          if python3 -c "import sys; sys.exit(0 if float('$age_h') <= float('$MAX_AGE_HOURS') else 1)"; then
            echo "'$GATE' on $SHA is ${age_h}h old; policy allows ${MAX_AGE_HOURS}h. Fresh enough."
            exit 0
          fi

          echo "::warning::'$GATE' on $SHA is ${age_h}h old, past the ${MAX_AGE_HOURS}h window. Re-assessing $TAG before deploying."
          dispatched_at="$(date -u +%s)"
          gh workflow run security.yml --repo "$REPO" --ref "$TAG" \
            || { echo "::error::Could not dispatch a fresh Security assessment for $TAG; refusing to deploy on a ${age_h}h-old pass."; exit 1; }

          # Wait for a Security Gate check run that FINISHED after the dispatch.
          # Matching on "completed after the dispatch time" rather than on a run
          # id is what stops the stale pass from satisfying its own re-check.
          deadline=$(( SECONDS + 2400 ))
          while :; do
            fresh="$(gh api --paginate "repos/${REPO}/commits/${SHA}/check-runs?per_page=100" \
              --jq '.check_runs[]' 2>/dev/null | jq -s -c \
              --arg n "$GATE" --argjson t "$dispatched_at" \
              '[.[] | select(.name == $n and .app.slug == "github-actions"
                             and .status == "completed" and .completed_at != null
                             and ((.completed_at | fromdateiso8601) > $t))]
               | sort_by(.id) | last // empty')"

            if [ -n "$fresh" ]; then
              conclusion="$(printf '%s' "$fresh" | jq -r '.conclusion // "none"')"
              if [ "$conclusion" = "success" ]; then
                echo "Fresh '$GATE' on $SHA concluded success. $TAG is deployable."
                exit 0
              fi
              echo "::error::The fresh '$GATE' assessment of $TAG concluded '$conclusion'. Refusing to deploy."
              echo "::error::$(printf '%s' "$fresh" | jq -r '.html_url')"
              exit 1
            fi

            if (( SECONDS >= deadline )); then
              echo "::error::The re-assessment of $TAG did not complete within 40 minutes."
              echo "::error::Refusing to deploy on a ${age_h}h-old Security Gate result."
              exit 1
            fi
            echo "waiting for the fresh '$GATE' assessment of $TAG ..."
            sleep 30
          done

      - name: Summarise the release gate
        if: always()
        env:
          TAG: ${{ steps.commit.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
          URL: ${{ steps.gate.outputs.url }}
          COMPLETED_AT: ${{ steps.gate.outputs.completed_at }}
        run: |
          {
            echo "### Release security gate — ${{ job.status }}"
            echo
            echo '```'
            echo "tag           $TAG"
            echo "commit        $SHA"
            echo "gate finished ${COMPLETED_AT:-—}"
            echo "gate run      ${URL:-—}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy the backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Nothing reaches production without a Security Gate that passed on the
    # exact commit the tag names, inside the policy's freshness window. A
    # `needs` rather than a step inside this job, so the failure is visible as
    # its own red job in the graph and so the deployment secrets scoped to the
    # Production environment below are never in scope while that is decided.
    needs: security-gate
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
      deployed_at: ${{ steps.deploy.outputs.deployed_at }}
      scan: ${{ steps.scan.outputs.result }}

    # Scopes the deployment secrets to this job and applies whatever protection
    # rules the Production environment carries.
    environment:
      name: Production
      url: https://manara-edu.com

    # workflow_run fires on completion whatever the outcome, so a FAILED publish
    # would otherwise deploy. The conclusion has to be checked explicitly.
    #
    # A manual dispatch used to be waved through here. Dispatching needs only
    # write access, and nothing beyond the tag's shape was checked — so any
    # semver tag pointing at any commit could be deployed to production. Both
    # paths now go through the same validation below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # ---------------------------------------------------------------------
      # 1. Which version is being deployed
      # ---------------------------------------------------------------------
      # For a run chained from a tag push, workflow_run.head_branch carries the
      # TAG name rather than a branch. It is validated rather than trusted: if
      # it is ever anything else the deployment stops here, with the server
      # untouched, instead of guessing at a version.
      - name: Resolve the release tag
        id: resolve
        env:
          RAW_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::Resolved '$RAW_TAG', which is not a vMAJOR.MINOR.PATCH release tag."
            echo "::error::A publish triggered by something other than a release tag does not deploy."
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying $RAW_TAG"

      # ---------------------------------------------------------------------
      # 2. Prove the release may be deployed at all
      # ---------------------------------------------------------------------
      # Same validator, same answers, as release and publish: the tag resolves
      # to a commit on main, a published release still points at it, and CI
      # passed on that exact commit. Run from this workflow's own checkout, so
      # nothing from the candidate decides whether the candidate is allowed.
      - name: Check out the validation scripts
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          .github/scripts/validate-promotion.sh \
            --tag "$TAG" \
            --require-release \
            --require-checks \
            --check "Build and test" \
            --check "Build the container image"

      # ---------------------------------------------------------------------
      # 3. Bind the image to that commit BEFORE touching production
      # ---------------------------------------------------------------------
      # The server pulls this tag in a moment. Resolving it here first means a
      # missing or half-published image fails on the runner, while production is
      # still happily serving the previous version, rather than mid-deployment.
      # It also records the digest, which is what actually identifies the
      # artifact — a tag is a movable label, a digest is not.
      - name: Wait for the image to be published to GHCR
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          # "Publish image" starts from the same Release run this workflow did, so
          # it is usually still building. Polling for the tag is what synchronises
          # the two without needing the version to survive a second workflow_run
          # hop — and it fails on the runner, with production still serving the
          # previous version, rather than part-way through a deployment.
          deadline=$(( SECONDS + 900 ))
          until docker manifest inspect "$IMAGE:$TAG" > /dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              echo "::error::$IMAGE:$TAG never appeared in GHCR after 15 minutes."
              echo "::error::Check whether the 'Publish image' run for $TAG succeeded."
              exit 1
            fi
            echo "waiting for $IMAGE:$TAG ..."
            sleep 20
          done
          DIGEST="$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')"

          # The version tag is a movable label; :sha-<commit> is not. Publishing
          # writes both to the same image, so if they still resolve to the same
          # digest then the artifact behind "$TAG" really is a build of the
          # commit that was just validated. If someone has re-pointed the version
          # tag at another image since, the two disagree and this stops.
          SHA_DIGEST="$(docker buildx imagetools inspect "$IMAGE:sha-$SHA" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          [[ -n "$SHA_DIGEST" ]] \
            || { echo "::error::No $IMAGE:sha-$SHA image. $TAG was not published from the validated commit."; exit 1; }
          [[ "$DIGEST" == "$SHA_DIGEST" ]] \
            || { echo "::error::$IMAGE:$TAG is $DIGEST but :sha-$SHA is $SHA_DIGEST. The version tag has been moved."; exit 1; }

          # The image's own provenance label must name the same commit. Self
          # asserted, so it is a consistency check rather than proof — but a
          # mismatch here means something is wrong that the digests alone did
          # not catch.
          REVISION="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Image}}' \
                      | jq -r '.config.Labels["org.opencontainers.image.revision"] // ""' 2>/dev/null || true)"
          if [[ -n "$REVISION" && "$REVISION" != "$SHA" ]]; then
            echo "::error::Image revision label is $REVISION, expected $SHA."
            exit 1
          fi

          echo "image=$IMAGE"   >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Approved $IMAGE:$TAG == :sha-$SHA -> $DIGEST"

      # ---------------------------------------------------------------------
      # The published artifact, scanned by digest
      # ---------------------------------------------------------------------
      # The Security Gate assessed an image built from this commit in CI. This
      # scans the image actually published and about to run, by digest, against
      # today's advisories, as frontend-foundation already does. An advisory
      # published after the release was cut stops the deployment here, with
      # production untouched. --ignore-unfixed is deliberately not set.
      - name: Install Trivy
        run: |
          bash .github/security/install-scanners.sh "${RUNNER_TEMP}/security-tools" trivy
          echo "${RUNNER_TEMP}/security-tools" >> "$GITHUB_PATH"

      - name: Scan the published image by digest
        id: scan
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/observation"
          report="$RUNNER_TEMP/observation/image-scan.txt"
          trivy image "$IMAGE@$DIGEST" --scanners vuln --severity HIGH,CRITICAL \
            --format table --exit-code 1 --timeout 20m --output "$report" || scan_failed=1
          cat "$report"
          if [ "${scan_failed:-0}" = "1" ]; then
            echo "result=blocked" >> "$GITHUB_OUTPUT"
            echo "::error title=Published image has blocking findings::$IMAGE@$DIGEST carries HIGH or CRITICAL"
            echo "::error::vulnerabilities. Production has NOT been touched. Fix or formally except the"
            echo "::error::findings and cut a new release."
            exit 1
          fi
          echo "result=pass" >> "$GITHUB_OUTPUT"
          echo "No HIGH or CRITICAL findings in the image about to be deployed."

      # ---------------------------------------------------------------------
      # 3. SSH
      # ---------------------------------------------------------------------
      # The host key is pinned rather than accepted on first sight. `ssh-keyscan`
      # into known_hosts trusts whatever answers on the day, which is the one
      # thing host-key checking exists to prevent — and this connection carries
      # the right to restart production.
      - name: Configure SSH
        id: ssh
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC9vjpkD1lqIDMx/gUnhc3AbZgWXBPIQwBPYWr6JvY6H\n' \
            "$HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # ---------------------------------------------------------------------
      # Is the host ready for this backend?
      # ---------------------------------------------------------------------
      # This backend refuses to start in production without an explicit commerce
      # mode (CommerceConfig), and production must never grant simulated paid
      # access. The mode reaches the container only if the host's
      # manara-infrastructure passes MANARA_COMMERCE_MODE through compose and
      # .env sets it. Checked BEFORE deploy.sh, which would otherwise replace a
      # healthy backend with one that cannot boot.
      - name: Check the host is ready for this backend
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/observation"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ConnectTimeout=20 "$USER@$HOST" \
              "cd /opt/manara && ./scripts/manifest.sh --json" > "$RUNNER_TEMP/observation/host-before.json" \
            || { echo "::error::The host could not report its configuration (scripts/manifest.sh --json). Production has NOT been touched."; exit 1; }
          python3 .github/scripts/release-evidence.py preflight \
            --runtime "$RUNNER_TEMP/observation/host-before.json" \
            --out "$RUNNER_TEMP/observation/preflight.json"

      # ---------------------------------------------------------------------
      # 4. Deploy
      # ---------------------------------------------------------------------
      # scripts/deploy.sh is the deployment abstraction that lives with the
      # compose file on the server: it pulls the exact tag, rewrites only the
      # BACKEND_IMAGE pin, restarts only this service, waits for the container to
      # report healthy, and restores the previous pin and exits non-zero if it
      # does not. Reimplementing that here would mean two definitions of what a
      # deployment is, drifting apart.
      #
      # No secret is passed over this connection. The server's .env already holds
      # them at mode 600 and is the only place they exist.
      - name: Deploy to Hetzner
        id: deploy
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          TAG: ${{ steps.resolve.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          # The digest goes with the tag. The host pins repo:tag@digest and
          # refuses anything else, so what runs in production is the artifact
          # verified above rather than whatever that tag resolves to by the time
          # the server pulls it. An empty digest here would silently degrade
          # into a tag deployment, so it is checked rather than assumed.
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::No verified digest to deploy."; exit 1; }
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ConnectTimeout=20 "$USER@$HOST" \
              "cd /opt/manara && ./scripts/deploy.sh backend '$TAG' '$DIGEST'"
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # 5. Prove it from outside
      # ---------------------------------------------------------------------
      # deploy.sh asserts the container reports healthy. This asserts the site
      # actually serves over the public internet — through Caddy, over TLS, from
      # off the machine — which is the only claim that matters to a user. A
      # container can be healthy while the ingress in front of it is not.
      - name: Verify production is serving
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/observation/http-checks.json"
          mkdir -p "$(dirname "$out")"
          for attempt in $(seq 1 10); do
            # No -f: an HTTP error is a status code to record, not a curl failure.
            root="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' https://manara-edu.com/ 2>/dev/null || true)"
            # 204 is this endpoint's success: it sets the CSRF cookie and returns
            # no body. Reaching it proves /api/* routes to the backend through Caddy.
            api="$(curl -sS -m 20 -o /dev/null -w '%{http_code}' https://manara-edu.com/api/v1/auth/csrf 2>/dev/null || true)"
            root="${root:-000}"; api="${api:-000}"
            if [ "$root" = "200" ] && [ "$api" = "204" ]; then break; fi
            echo "attempt $attempt: root=$root api=$api, retrying..."
            sleep 10
          done
          printf '[{"name":"the site root serves","target":"https://manara-edu.com/","expected":"200","observed":"%s","ok":%s},{"name":"the API reaches the backend","target":"https://manara-edu.com/api/v1/auth/csrf","expected":"204","observed":"%s","ok":%s}]\n' \
            "$root" "$([ "$root" = 200 ] && echo true || echo false)" \
            "$api" "$([ "$api" = 204 ] && echo true || echo false)" > "$out"
          if [ "$root" = "200" ] && [ "$api" = "204" ]; then
            echo "https://manara-edu.com/ -> 200, /api/v1/auth/csrf -> 204"
          else
            echo "::error::Production did not serve correctly after the deployment (root=$root api=$api)."
            exit 1
          fi

      # ---------------------------------------------------------------------
      # What is the host actually running now?
      # ---------------------------------------------------------------------
      # Recorded on every attempt that reached the host, successful or not:
      # after a failure it is the recovery evidence. It is the host's own report
      # (manara-infrastructure scripts/manifest.sh --json): image digests,
      # revisions, the commerce mode and secret PRESENCE. No secret value
      # leaves the host.
      - name: Observe what production is running
        if: always() && steps.ssh.outcome == 'success'
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/observation"
          if ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
                 -o ConnectTimeout=20 "$USER@$HOST" \
                 "cd /opt/manara && ./scripts/manifest.sh --json" > "$RUNNER_TEMP/observation/runtime.json"; then
            echo "Recorded the host's report."
          else
            rm -f "$RUNNER_TEMP/observation/runtime.json"
            echo "::warning::The host did not report what it runs; the release evidence will say so."
          fi

      # A healthy container and a serving site do not prove the host runs the
      # approved artifact, configured as required. This does, from the host's
      # report: the approved digest and commit, .env closed to other users and
      # untracked, and for the backend an allowed commerce mode and every secret injected.
      - name: Check the running release against what was approved
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          python3 .github/scripts/release-evidence.py check-runtime \
            --runtime "$RUNNER_TEMP/observation/runtime.json" --service backend \
            --image "$IMAGE" --digest "$DIGEST" --sha "$SHA" \
            --out "$RUNNER_TEMP/observation/runtime-checks.json"

      - name: Keep the observation for the evidence job
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-observation
          path: ${{ runner.temp }}/observation/
          retention-days: 90
          if-no-files-found: warn

      - name: Summarise the deployment
        if: always()
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "### Backend deployment — ${{ job.status }}"
            echo
            echo '```'
            echo "tag     $TAG"
            echo "image   $IMAGE:$TAG"
            echo "digest  $DIGEST"
            echo '```'
            echo
            echo "If this failed, production is still serving whatever it was before the"
            echo "restart, and no volume was touched. Roll back with:"
            echo
            echo '```'
            echo "ssh <deploy-user>@<host> 'cd /opt/manara && ./scripts/rollback.sh backend'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Release evidence (TECH-32, TECH-60)
  # ===========================================================================
  # One machine-readable manifest per deployment attempt, attached to the
  # GitHub Release together with the security evidence it cites, then proved
  # to resolve. See docs/security/RELEASE_EVIDENCE.md. A separate job, so the
  # Production environment's secrets are out of scope while it runs, and so a
  # FAILED attempt is recorded as faithfully as a successful one.
  evidence:
    name: Record the release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [security-gate, deploy]
    if: always() && needs.security-gate.result == 'success' && needs.deploy.result != 'skipped'
    permissions:
      contents: write   # attach the manifest and bundle to the GitHub Release
      actions: read     # read the assessment run and download its artifacts
      checks: read      # resolve the Security Gate and build check runs
      packages: read    # re-resolve the image digest in GHCR
    steps:
      - name: Check out the evidence script
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Download the deployment observation
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deployment-observation
          path: observation

      - name: Build the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.security-gate.outputs.tag }}
          SHA: ${{ needs.security-gate.outputs.sha }}
          IMAGE: ${{ needs.deploy.outputs.image }}
          DIGEST: ${{ needs.deploy.outputs.digest }}
          DEPLOYED_AT: ${{ needs.deploy.outputs.deployed_at }}
          SCAN: ${{ needs.deploy.outputs.scan }}
          STATUS: ${{ needs.deploy.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -uo pipefail
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.3' \
            || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages 'PyYAML==6.0.3'
          reason=""
          [ -s observation/runtime.json ] || reason="the deploy job did not obtain the host's report"
          python3 .github/scripts/release-evidence.py collect \
            --repository "$REPO" --service backend --tag "$TAG" --sha "$SHA" \
            --image "${IMAGE:-ghcr.io/manara-education/backend-foundation}" --digest "${DIGEST:-unresolved}" \
            --deploy-run-id "$RUN_ID" --deploy-run-attempt "$RUN_ATTEMPT" \
            --deploy-status "$STATUS" --deployed-at "$DEPLOYED_AT" \
            --required-check "Build and test" --required-check "Build the container image" \
            --verification observation/preflight.json \
            --verification observation/http-checks.json \
            --verification observation/runtime-checks.json \
            --runtime observation/runtime.json --runtime-reason "$reason" \
            --image-scan observation/image-scan.txt --image-scan-result "${SCAN:-not-run}" \
            --out evidence
          rc=$?
          # 1 means the manifest was written and records problems; 2 means no
          # manifest could be built at all.
          if [ "$rc" -eq 1 ]; then echo "::warning title=Release evidence::the manifest records problems; see its 'problems' list."; fi
          [ "$rc" -le 1 ] || exit "$rc"

      - name: Keep the evidence as a workflow artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: evidence/
          retention-days: 90
          if-no-files-found: warn

      # Workflow artifacts expire; release assets stay with the GitHub Release.
      - name: Attach the manifest and bundle to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.security-gate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          manifest="$(sed -n 1p evidence/asset-names.txt)"
          bundle="$(sed -n 2p evidence/asset-names.txt)"
          cp evidence/release-manifest.json "evidence/$manifest"
          gh release upload "$TAG" -R "$REPO" --clobber "evidence/$manifest" "evidence/$bundle"
          echo "Attached $manifest and $bundle to $TAG."

      - name: Prove every reference in the manifest resolves
        if: needs.deploy.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          python3 .github/scripts/release-evidence.py verify --manifest evidence/release-manifest.json

      - name: Summarise the evidence
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("evidence/release-manifest.json")
          print("### Release evidence\n")
          if not p.exists():
              print("_No manifest was produced; see the job log._")
              raise SystemExit
          m = json.loads(p.read_text())
          v = m["security"].get("verdict") or {}
          print("```")
          print(f"release     {m['release']['tag']} @ {m['release']['commit']}")
          print(f"artifact    {m['artifact']['reference']}")
          print(f"gate        {m['security']['gate'].get('conclusion')}  {m['security']['gate'].get('url')}")
          print(f"verdict     {v.get('status')}  generated {v.get('generated_at')}")
          print(f"deployment  {m['deployment']['status']}  at {m['deployment']['deployed_at']}")
          print(f"runtime     {m['runtime_observation']['status']}")
          print(f"manifest    {m['evidence']['manifest_asset']}")
          print(f"bundle      {m['evidence']['bundle']['url']}")
          print(f"            {m['evidence']['bundle']['sha256']}")
          print("```")
          for problem in m.get("problems") or []:
              print(f"- ⚠ {problem}")
          PY
