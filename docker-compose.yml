services:
  postgres:
    container_name: manara_db
    image: postgres:17.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: manara_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    container_name: manara_redis
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  app:
    container_name: manara-backend
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/manara_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - COOKIE_SECURE=true
      # Supplied from the host environment / .env — never hardcode the key here.
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM=${MAIL_FROM:-no-reply@manara-edu.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Manara}
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-support@manara-edu.com}
    restart: always

volumes:
  postgres_data:
  redis_data:
