services:
  postgres:
    container_name: manara_db
    # Kept in step with production (infrastructure repo, docker-compose.prod.yml)
    # and with AbstractPostgresBackedTest. 17.5 was inside the affected range of
    # CVE-2025-8713/8714/8715, all three fixed in 17.6; 17.10 carries them.
    #
    # 17.10 and not 17.11, deliberately. The only CVE 17.11 adds over 17.10 is
    # CVE-2026-14681 (GSSAPI encryption coupled with SSL, CVSS 4.2), and nothing
    # here speaks GSSAPI. Against that, the arm64 build of 17.11 aborts with a
    # bus error inside initdb on Docker Desktop, deterministically, so pinning it
    # would stop the database and the whole Testcontainers suite from starting on
    # every Apple Silicon machine. Revisit when 17.12 ships an arm64 build that runs.
    image: postgres:17.10
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No fallback. This used to default to the literal `password` while the
      # port below listened on every interface, so any machine that could route
      # to a developer's laptop could log in to its database. The stack now
      # refuses to start until a password has been chosen in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-manara_db}
    # Loopback only. The application run from an IDE or ./mvnw on this machine
    # reaches the database at localhost:5432, and the `app` service below
    # reaches it over the compose network, which uses no published port at all.
    # A bare "5432:5432" publishes on 0.0.0.0 — every network this machine
    # joins, office LAN or café Wi-Fi.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # depends_on: service_healthy below waits on this, so the application is not
    # started against a database that is still initialising.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-manara_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    container_name: manara_redis
    image: redis:7.4-alpine
    # AUTH is on whenever REDIS_PASSWORD is set, and it should be: Redis holds
    # every session and every rate-limit counter. Left empty, Redis runs without
    # AUTH, and the loopback binding below is then the only thing keeping other
    # machines out. Run through a shell so an unset password adds no argument at
    # all, rather than an empty `--requirepass ""`.
    command: ["sh", "-c", "exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Loopback only, for the same reason as PostgreSQL above.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$$REDIS_PASSWORD\" ] || export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    container_name: manara-backend
    build: .
    ports:
      - "8080:8080"
    # Wait for both to be HEALTHY, not merely created. Plain `depends_on` only
    # orders container start, so the application would previously race Postgres'
    # first-run initialisation and Flyway would fail to connect.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Variable names match .env.example and application.properties one-for-one,
      # so the same names work locally, in compose and in production.
      #
      # The published port above is 8080, so the app must listen on 8080 inside
      # the container. Without this it binds application.properties' local
      # default of 8081 and the published port reaches nothing.
      - SERVER_PORT=8080
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-manara_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - COOKIE_SECURE=true
      # Supplied from the host environment / .env — never hardcode the key here.
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM=${MAIL_FROM:-no-reply@manara-edu.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Manara}
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-support@manara-edu.com}
      # Absolute path onto the named volume mounted below.
      - UPLOADS_DIR=/app/uploads
    volumes:
      # Uploaded images live in a volume, NOT in the container's writable layer.
      # Without this every `docker compose up --build`, every image update and
      # every `docker rm` silently destroyed every file a user had uploaded —
      # the container filesystem is discarded when the container is replaced.
      - uploads_data:/app/uploads
    restart: always

volumes:
  postgres_data:
  redis_data:
  uploads_data:
