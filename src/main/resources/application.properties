# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/manara_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# App
spring.application.name=manara-backend
server.port=8081

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Redis (session store)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Spring Session
spring.session.store-type=redis
spring.session.redis.namespace=manara:session
spring.session.redis.flush-mode=on_save
spring.session.timeout=30m

# Session cookie (overrides handled in SessionConfig for SameSite + Secure)
server.servlet.session.cookie.name=MANARA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
# Toggle Secure flag per environment (true in prod over HTTPS)
app.security.cookie-secure=${COOKIE_SECURE:false}

# OTP
otp.expiration-minutes=10

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.persistAuthorization=true
