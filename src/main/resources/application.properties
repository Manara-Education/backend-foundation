# Database
# Every value is environment-driven. The defaults are the local docker-compose
# database and are deliberately non-secret; production supplies real values
# through the environment (see application-prod.properties, which drops the
# defaults so a missing variable fails startup instead of silently falling back
# to localhost).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/manara_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Flyway owns the schema; Hibernate only checks that the entity model matches it.
# This was `update`, which let Hibernate silently alter production tables on
# startup — and, because `update` never adds a constraint or index to a table
# that already exists, quietly left the database missing them. `validate` fails
# startup on drift instead of papering over it.
spring.jpa.hibernate.ddl-auto=validate
# Overridden to false in production — see application-prod.properties.
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Uploads
# Where uploaded images are written to and served from. Relative paths resolve
# against the working directory, which keeps a plain `mvn spring-boot:run` working.
# Production sets an absolute path onto a mounted volume so files survive the
# container being replaced — see docker-compose.yml.
app.uploads.dir=${UPLOADS_DIR:uploads}
# Everything this application uploads is an image (course covers, instructor
# banners), and the frontend already sends only these. Nothing else is accepted.
app.uploads.allowed-media-types=image/jpeg,image/png,image/webp,image/gif
app.uploads.allowed-extensions=jpg,jpeg,png,webp,gif
# Bounds decoded size, which the 5 MB file limit does not: a small, highly
# compressed image can expand to an enormous raster.
app.uploads.max-pixels=50000000

# App
spring.application.name=manara-backend
# Local/default port. Production listens on 8080 — see application-prod.properties.
# Kept at 8081 here because the frontend dev server proxies /api and /uploads to
# http://localhost:8081 (frontend-foundation/vite.config.ts).
server.port=${SERVER_PORT:8081}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Redis (session store)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Spring Session
spring.session.store-type=redis
spring.session.redis.namespace=manara:session
spring.session.redis.flush-mode=on_save
spring.session.timeout=30m

# Session cookie (overrides handled in SessionConfig for SameSite + Secure)
server.servlet.session.cookie.name=MANARA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
# Toggle Secure flag per environment (true in prod over HTTPS)
app.security.cookie-secure=${COOKIE_SECURE:false}

# OTP
otp.expiration-minutes=10

# Email (provider-independent: the sender belongs to the email feature, not to its callers)
email.from.address=${MAIL_FROM:no-reply@manara-edu.com}
email.from.name=${MAIL_FROM_NAME:Manara}
email.reply-to=${MAIL_REPLY_TO:support@manara-edu.com}

# Resend (secret supplied only via the environment — never commit a key here)
resend.api-key=${RESEND_API_KEY:}

# Flyway (schema migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# The setting that makes a broken Flyway setup loud instead of silent. By default
# Flyway shrugs at a location that does not exist and reports "0 migrations" — the
# same successful-looking startup you get when Flyway is not running at all. With
# this true, a renamed folder, a bad `locations` value or migrations missing from
# the packaged jar aborts startup and names the location it could not find.
spring.flyway.fail-on-missing-locations=true
# A database that already carries this schema — every existing developer machine —
# is recorded at version 1 and left untouched rather than having V1 replayed over
# it. Only a genuinely empty database runs the baseline.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline schema
# Refuse to start on a checksum mismatch or a missing applied migration rather
# than attempting a repair. An edited migration is a mistake to fix, not to
# tolerate silently.
spring.flyway.validate-on-migrate=true
# Never, under any circumstances, allow `flyway clean` — it drops every object in
# the schema. Nothing in this application calls it; this makes it impossible.
spring.flyway.clean-disabled=true

# i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Actuator (health only)
# Exactly one endpoint is exposed over HTTP. The default exposure is already
# health-only, but stating it means a future dependency or property cannot widen
# it silently — /actuator/env and /actuator/configprops would print configuration,
# including resolved secrets, to anyone who can reach them.
# NOTE: there is deliberately no `exposure.exclude` here. Spring Boot gives
# `exclude` precedence over `include`, so adding `exclude=*` alongside this would
# exclude health as well and the endpoint would 404 — which is exactly what
# happened when it was first written that way. An include-list of one is already
# the tightest possible exposure.
management.endpoints.web.exposure.include=health
management.endpoint.health.access=read-only

# Show component detail (db, redis, diskSpace) only to an authenticated caller.
# Anonymous callers — which includes the container's own healthcheck and any
# uptime monitor — get the bare {"status":"UP"} and learn nothing about the
# internals from a failure.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized

# Liveness and readiness as separate probes. Readiness is what a deployment must
# gate on: it reports DOWN while the application is still starting, and again if
# it loses the database, so traffic is not sent to an instance that cannot serve.
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

management.health.db.enabled=true
management.health.redis.enabled=true

# Put db and redis INTO the readiness group. This line is the entire point of the
# endpoint and it is easy to miss: by default the readiness group contains only
# `readinessState`, the in-process availability flag. Verified by stopping the
# Postgres container — /actuator/health/readiness happily kept returning
# {"status":"UP"} while the database was gone, so a healthcheck pointed at it was
# asserting nothing. With db and redis included, an instance that cannot reach its
# database or its session store correctly reports itself not ready.
management.endpoint.health.group.readiness.include=readinessState,db,redis

# Liveness deliberately stays as the process-level check only. It must NOT include
# db or redis: liveness failing means "restart this container", and restarting the
# application does nothing whatsoever about an unreachable database — it would just
# produce a restart loop during any database blip.
management.endpoint.health.group.liveness.include=livenessState

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.persistAuthorization=true
