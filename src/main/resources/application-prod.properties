# Production profile — activated with SPRING_PROFILES_ACTIVE=prod.
#
# This file holds no secrets and never will. Every value below is either a
# hardcoded production *policy* decision or a reference to an environment
# variable supplied at runtime by the deployment (GitHub environment secrets ->
# compose -> container environment).
#
# The rule that shapes this file: production placeholders carry NO default. A
# missing DATABASE_URL must abort startup, not quietly connect to a localhost
# database that does not exist on the production host. Fail fast, loudly.

# --- Server ---------------------------------------------------------------
# Production listens on 8080. Only Caddy reaches this port, over the private
# Docker network; 8080 is never published to the host or the internet.
server.port=8080

# Caddy terminates TLS and proxies to this container. Without this, Spring sees
# every request as plain HTTP and would emit http:// redirects and mark secure
# cookies as insecure.
server.forward-headers-strategy=native

# Do not leak stack traces or internal messages to API clients.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# --- Database -------------------------------------------------------------
# No defaults: startup fails if the deployment did not supply these.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# A 1 vCPU / 2 GiB host running Postgres, Redis, Caddy and the JVM side by side
# cannot afford Hikari's default pool of 10 idle connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=10000

# --- Schema ---------------------------------------------------------------
# Stated explicitly here as well as in application.properties. This is the single
# most destructive setting in the file: any value other than `validate` or `none`
# gives Hibernate permission to alter production tables during startup. Pinning it
# in the production profile means a change to the shared default cannot silently
# reach production.
spring.jpa.hibernate.ddl-auto=validate

# --- JPA / Hibernate ------------------------------------------------------
# SQL logging off in production: it is a performance tax and it prints
# parameter values — including user data — into container logs.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Session --------------------------------------------------------------
# Production is HTTPS-only, so the session cookie must carry Secure.
app.security.cookie-secure=${COOKIE_SECURE:true}

# --- Logging --------------------------------------------------------------
# Quiet the frameworks; keep application logs at INFO. Explicitly pin the SQL
# loggers to WARN so no stray DEBUG config can turn statement logging back on.
logging.level.root=WARN
logging.level.com.manara.backend=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
