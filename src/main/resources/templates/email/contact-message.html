<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SUBJECT}}</title>
</head>
<body style="margin:0;padding:0;background:#F8F9FD;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F8F9FD;padding:24px 0;">
<tr>
<td align="center">
<table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#FFFFFF;border-radius:16px;border:1px solid #E4E7F2;">
<tr>
<td style="padding:28px 32px 8px 32px;text-align:{{ALIGN}};">
<h1 style="margin:0 0 4px 0;font-size:18px;color:#1E2340;">{{TITLE}}</h1>
<p style="margin:0;font-size:13px;color:#9BA3C4;">{{TOPIC_LABEL}}: {{TOPIC}}</p>
</td>
</tr>
<tr>
<td style="padding:16px 32px;text-align:{{ALIGN}};">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #E4E7F2;border-bottom:1px solid #E4E7F2;">
<tr>
<td style="padding:14px 0;font-size:13px;color:#717182;">{{NAME_LABEL}}</td>
<td style="padding:14px 0;font-size:14px;color:#1E2340;font-weight:600;text-align:{{VALUE_ALIGN}};" dir="ltr">{{NAME}}</td>
</tr>
<tr>
<td style="padding:14px 0;font-size:13px;color:#717182;border-top:1px solid #F1F2F8;">{{EMAIL_LABEL}}</td>
<td style="padding:14px 0;font-size:14px;color:#1E2340;font-weight:600;text-align:{{VALUE_ALIGN}};border-top:1px solid #F1F2F8;" dir="ltr">{{EMAIL}}</td>
</tr>
</table>
</td>
</tr>
<tr>
<td style="padding:8px 32px 28px 32px;text-align:{{ALIGN}};">
<p style="margin:0 0 6px 0;font-size:13px;color:#717182;">{{MESSAGE_LABEL}}</p>
<p style="margin:0;font-size:14px;color:#1E2340;line-height:1.8;white-space:pre-wrap;">{{MESSAGE}}</p>
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
