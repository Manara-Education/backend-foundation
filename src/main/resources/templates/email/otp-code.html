<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <title>{{TITLE}}</title>
    <style>
        /* Cairo is the Manara brand face. Clients that ignore @import fall back to Tahoma,
           which renders Arabic well; the layout never depends on the webfont loading. */
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

        /* Mobile refinements. The base styles alone stay readable if a client drops these. */
        @media only screen and (max-width: 480px) {
            .m-outer  { padding: 20px 8px !important; }
            .m-header { padding: 24px 24px 20px !important; }
            .m-body   { padding: 28px 24px 24px !important; }
            .m-footer { padding: 20px 24px !important; }
            .m-title  { font-size: 20px !important; }
            .m-otp    { font-size: 30px !important; letter-spacing: 8px !important;
                        text-indent: 8px !important; padding: 16px 20px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #F4F5F9; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">

<table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0"
       style="border-collapse: collapse; background-color: #F4F5F9;">
    <tr>
        <td align="center" class="m-outer" style="padding: 40px 16px;">

            <!--[if mso]>
            <table role="presentation" width="600" border="0" cellpadding="0" cellspacing="0" align="center"><tr><td>
            <![endif]-->

            <!-- Main container. Outlook ignores max-width, hence the ghost table above; every
                 other client uses the fluid width so narrow screens never scroll sideways. -->
            <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0"
                   style="width: 100%; max-width: 600px; border-collapse: collapse; background-color: #FFFFFF;
                          border: 1px solid #EAEBF2; border-radius: 20px;
                          box-shadow: 0 4px 24px rgba(78, 91, 146, 0.08);">

                <!-- Header / brand lockup -->
                <tr>
                    <td align="center" class="m-header"
                        style="background-color: #4E5B92;
                               background-image: linear-gradient(135deg, #4E5B92 0%, #364178 100%);
                               padding: 32px 40px 28px; border-radius: 20px 20px 0 0;">
                        <!-- Brand lockup. Source order is text, spacer, mark: under dir=rtl the
                             text lands on the right and the mark on the left, as approved; LTR
                             mirrors it naturally. -->
                        <table role="presentation" border="0" cellpadding="0" cellspacing="0" align="center"
                               dir="{{DIR}}" style="border-collapse: collapse; margin: 0 auto;">
                            <tr>
                                <td valign="middle" style="text-align: {{ALIGN}};">
                                    <div style="font-family: 'Cairo', 'Noto Sans Arabic', Tahoma, Arial, sans-serif;
                                                font-weight: 700; font-size: 22px; color: #FFFFFF; line-height: 1.3;">{{BRAND_NAME}}</div>
                                    <div dir="ltr" style="font-family: 'Cairo', 'Noto Sans Arabic', Tahoma, Arial, sans-serif;
                                                font-size: 10px; color: #B8BDD3; letter-spacing: 3px; padding-top: 4px;
                                                text-align: {{ALIGN}};">MANARA</div>
                                </td>
                                <td width="12" style="font-size: 0; line-height: 0;">&nbsp;</td>
                                <td valign="middle">
                                    <img src="cid:{{LOGO_CID}}" width="44" height="44" alt="{{LOGO_ALT}}"
                                         style="display: block; border: 0; outline: none; text-decoration: none;
                                                width: 44px; height: 44px;">
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Body -->
                <tr>
                    <td class="m-body" style="padding: 40px 48px 32px; direction: {{DIR}}; text-align: {{ALIGN}};">

                        <p class="m-title" style="margin: 0 0 12px; font-family: 'Cairo', 'Noto Sans Arabic', Tahoma, Arial, sans-serif;
                                  font-size: 24px; font-weight: 700; color: #1E2340; line-height: 1.4;">{{TITLE}}</p>

                        <p style="margin: 0 0 32px; font-family: 'Cairo', 'Noto Sans Arabic', Tahoma, Arial, sans-serif;
                                  font-size: 15px; color: #717182; line-height: 1.75;">{{INTRO}}</p>

                        <!-- OTP: isolated from the surrounding RTL flow so the digits never reorder -->
                        <table role="presentation" border="0" cellpadding="0" cellspacing="0" align="center"
                               style="border-collapse: collapse; margin: 0 auto 12px;">
                            <tr>
                                <td class="m-otp" align="center"
                                    style="background-color: #F4F5F9; border: 2px solid #D3D6E4; border-radius: 16px;
                                           padding: 20px 40px; font-family: 'Courier New', Courier, monospace;
                                           font-size: 42px; font-weight: 700; color: #4E5B92; letter-spacing: 12px;
                                           text-indent: 12px; direction: ltr; unicode-bidi: isolate;
                                           text-align: center; line-height: 1;">{{OTP}}</td>
                            </tr>
                        </table>

                        <p style="margin: 0 0 32px; font-family: 'Cairo', 'Noto Sans Arabic', Tahoma, Arial, sans-serif;
                                  font-size: 13px; color: #9BA3C4; text-align: center; line-height: 1.6;">{{EXPIRY_LEAD}}
                            <strong style="color: #717182;">{{EXPIRY_VALUE}}</strong></p>

                        <!-- Divider -->
                        <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0"
                               style="border-collapse: collapse; margin-bottom: 24px;">
                            <tr>
                                <td style="border-top: 1px solid #EDEFF4; font-size: 0; line-height: 0; height: 1px;">&nbsp;</td>
                            </tr>
                        </table>

                        <!-- Security notice -->
                        <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0"
                               style="border-collapse: collapse; margin-bottom: 20px;">
                            <tr>
                                <td style="background-color: #F6F7FA; border: 1px solid #EAEBF2; border-radius: 12px;
                                           padding: 14px 18px; direction: {{DIR}}; text-align: {{ALIGN}};
                                           font-family: 'Cairo', 'Noto Sans Arabic', Tahoma, Arial, sans-serif;
                                           font-size: 13px; color: #4B5563; line-height: 1.7;">{{SECURITY_LEAD}}
                                    <strong>{{SECURITY_STRONG}}</strong>{{SECURITY_TAIL}}</td>
                            </tr>
                        </table>

                        <p style="margin: 0; font-family: 'Cairo', 'Noto Sans Arabic', Tahoma, Arial, sans-serif;
                                  font-size: 13px; color: #B0B7D4; line-height: 1.7; text-align: {{ALIGN}};">{{DISCLAIMER}}</p>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td class="m-footer" style="border-top: 1px solid #ECEEF4; background-color: #FAFBFD;
                               padding: 24px 48px; direction: {{DIR}}; text-align: {{ALIGN}};
                               border-radius: 0 0 20px 20px;">
                        <p style="margin: 0 0 4px; font-family: 'Cairo', 'Noto Sans Arabic', Tahoma, Arial, sans-serif;
                                  font-size: 13px; color: #717182; line-height: 1.7;">{{SIGNOFF}}</p>
                        <p style="margin: 0 0 16px; font-family: 'Cairo', 'Noto Sans Arabic', Tahoma, Arial, sans-serif;
                                  font-size: 14px; font-weight: 700; color: #4E5B92; line-height: 1.4;">{{TEAM}}</p>
                        <p style="margin: 0; font-family: 'Cairo', 'Noto Sans Arabic', Tahoma, Arial, sans-serif;
                                  font-size: 11px; color: #C4C9DC; line-height: 1.6;">{{COPYRIGHT}}</p>
                    </td>
                </tr>

            </table>

            <!--[if mso]>
            </td></tr></table>
            <![endif]-->

        </td>
    </tr>
</table>

</body>
</html>
