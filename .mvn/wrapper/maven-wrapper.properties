# Generated by `mvnw wrapper:wrapper -Dtype=only-script`, then pinned by hand.
#
# distributionType=only-script means no maven-wrapper.jar is committed to this
# repository — the script fetches Maven itself. Nothing binary enters git.
#
# distributionSha256Sum is not generated by the plugin and was added
# deliberately: without it the wrapper executes whatever bytes the download
# returns. The value below was verified against Apache's published
# apache-maven-3.10.0-bin.zip.sha512 before being recorded here. If Maven is
# upgraded, this line MUST be updated too or the build will fail closed.
wrapperVersion=3.3.4
distributionType=only-script
